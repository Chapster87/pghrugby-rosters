name: Deploy to DreamHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dreamhost
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Configure SSH
        env:
          DREAMHOST_HOST: ${{ secrets.DREAMHOST_HOST }}
          DREAMHOST_USERNAME: ${{ secrets.DREAMHOST_USERNAME }}
          DREAMHOST_SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write private key; normalize possible CRLF from secret paste
          printf '%s\n' "$DREAMHOST_SSH_KEY" | tr -d '\r' > ~/.ssh/dreamhost_deploy
          chmod 600 ~/.ssh/dreamhost_deploy

          # Force a single identity so ssh does not try other keys and hit
          # "Too many authentication failures" on DreamHost
          {
            echo "Host dreamhost"
            echo "  HostName ${DREAMHOST_HOST}"
            echo "  User ${DREAMHOST_USERNAME}"
            echo "  IdentityFile ~/.ssh/dreamhost_deploy"
            echo "  IdentitiesOnly yes"
            echo "  PreferredAuthentications publickey"
            echo "  PasswordAuthentication no"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

          ssh-keyscan -H "$DREAMHOST_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: ssh -o BatchMode=yes -o ConnectTimeout=15 dreamhost 'echo SSH_OK && pwd'

      - name: Deploy to DreamHost via rsync
        env:
          DREAMHOST_REMOTE_PATH: ${{ secrets.DREAMHOST_REMOTE_PATH }}
        run: |
          rsync -avz --delete \
            -e "ssh -o IdentitiesOnly=yes" \
            ./out/ \
            "dreamhost:${DREAMHOST_REMOTE_PATH}"
